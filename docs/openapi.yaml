openapi: 3.1.0
info:
  title: Omnisocial API
  version: 1.0.0
  description: Profile-scoped publishing API for Omnisocial.
servers:
  - url: https://socialmedia-publisher-gules.vercel.app
security:
  - bearerAuth: []
paths:
  /api/v1/accounts:
    get:
      summary: List connected accounts
      parameters:
        - in: query
          name: platforms
          schema: { type: string }
      responses:
        '200': { description: Connected accounts }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/media:
    post:
      summary: Upload media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Media uploaded }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '413': { description: Upload too large }
        '415': { description: Unsupported media }
  /api/v1/publish:
    post:
      summary: Publish or schedule a post
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._~:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '202': { description: Post accepted }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { description: Idempotency/state conflict }
        '413': { description: JSON body too large }
        '429': { description: Rate limited }
        '503': { description: Protection unavailable }
  /api/v1/posts:
    get:
      summary: List posts
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, scheduled, publishing, published, failed] } }
        - { in: query, name: platform, schema: { $ref: '#/components/schemas/Platform' } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200': { description: Post list }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/v1/posts/{postId}:
    parameters:
      - { in: path, name: postId, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get post and publishing results
      responses:
        '200': { description: Post status }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { description: Post not found }
    patch:
      summary: Edit draft or scheduled post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostPatch' }
      responses:
        '200': { description: Updated post }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { description: Post not found }
        '409': { description: Post is not editable }
    delete:
      summary: Delete draft or cancel scheduled post
      responses:
        '200': { description: Deleted or cancelled }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { description: Post not found }
        '409': { description: Post cannot be cancelled }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Omnisocial API key
  schemas:
    Platform:
      type: string
      enum: [facebook, instagram, threads, linkedin, x, youtube, tiktok]
    PublishPlatform:
      type: string
      enum: [facebook, instagram, threads, linkedin, youtube, tiktok]
    PublishRequest:
      type: object
      additionalProperties: false
      required: [platforms]
      properties:
        platforms:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { $ref: '#/components/schemas/PublishPlatform' }
        text: { type: string, maxLength: 5000 }
        media_paths:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        scheduled_at: { type: string, format: date-time }
      description: At least text or one media file is required.
    PostPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        content: { type: string, maxLength: 5000 }
        media_paths:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        scheduled_at: { type: string, format: date-time }
  responses:
    Error400:
      description: Bad request
    Error401:
      description: Missing, invalid, or revoked API key
